<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kalkulator Nilai Siswa</title>
  <script>
    function hitungNilai() {
      const pgBenar = parseInt(document.getElementById("pgBenar").value) || 0;
      const isianBenar = parseInt(document.getElementById("isianBenar").value) || 0;
      const uraianBenar = parseInt(document.getElementById("uraianBenar").value) || 0;

      const skorPG = pgBenar * 1;
      const skorIsian = isianBenar * 1;
      const skorUraian = uraianBenar * 3;

      const totalSkor = skorPG + skorIsian + skorUraian;
      const skorIdeal = (20 * 1) + (15 * 1) + (5 * 3);

      const nilaiAkhir = (totalSkor / skorIdeal) * 100;
      const nilaiAkhirScaled = 70 + (nilaiAkhir / 100) * 30;

      document.getElementById("hasil").innerText = `Nilai Akhir (Skala 70-100): ${nilaiAkhirScaled.toFixed(2)}`;
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

    body {
      font-family: 'Poppins', sans-serif;
      padding: 30px;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #333;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      color: white;
      animation: fadeIn 0.6s ease;
    }

    h2 {
      text-align: center;
      font-weight: 600;
      margin-bottom: 20px;
    }

    label {
      font-weight: 500;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      margin-bottom: 15px;
      border-radius: 8px;
      border: none;
      outline: none;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #ffca28;
      color: #333;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      transition: 0.3s;
    }

    button:hover {
      background: #ffb300;
      transform: scale(1.03);
    }

    #hasil {
      margin-top: 20px;
      font-size: 22px;
      font-weight: 600;
      text-align: center;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Kalkulator Nilai Ulangan Siswa</h2>
    <h3>Ari rusmawan project</h3>

    <label>Pilihan Ganda Benar (maks: 20):</label>
    <input type="number" id="pgBenar" max="20" min="0" />

    <label>Isian Benar (maks: 15):</label>
    <input type="number" id="isianBenar" max="15" min="0" />

    <label>Uraian Benar (maks: 5):</label>
    <input type="number" id="uraianBenar" max="5" min="0" />

    <button onclick="hitungNilai()">Hitung Nilai</button>

    <div id="hasil"></div>
  </div>
</body>
</html>
